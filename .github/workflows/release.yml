name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
         "$KEYSTORE_BASE64" | base64 -d > keystore.jks

    - name: Build Signed Release APK
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew assembleUniversalGmsRelease assembleArm64GmsRelease

    - name: Build Debug APK (Fallback if Keystore not set)
      if: ${{ env.KEYSTORE_BASE64 == '' }}
      run: |
        chmod +x gradlew
        ./gradlew assembleUniversalGmsDebug assembleArm64GmsDebug

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Muzi Music ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          app/build/outputs/apk/**/*.apk
